<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Stay Finder</title>


<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        font-family: Arial, sans-serif;
        background: #f3f6fc;
    }

    .reset-card {
        width: 100%;
        max-width: 420px;
        padding: 35px;
        background: white;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
        margin-top: 0;
        color: #173b70;
        text-align: center;
    }

    p {
        color: #64748b;
        line-height: 1.6;
    }

    label {
        display: block;
        margin: 18px 0 8px;
        font-weight: 600;
    }

    input {
        width: 100%;
        padding: 13px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 15px;
    }

    button {
        width: 100%;
        margin-top: 22px;
        padding: 14px;
        border: none;
        border-radius: 8px;
        background: #173b70;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #24549a;
    }

    button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    #message {
        margin-top: 16px;
        overflow-wrap: anywhere;
    }

    .back-link {
        display: block;
        margin-top: 20px;
        color: #173b70;
        text-align: center;
        text-decoration: none;
    }
</style>


</head>

<body>
    <main class="reset-card">
        <h1>Create New Password</h1>


    <p>Enter your new password below.</p>

    <form id="resetForm">
        <label for="newPassword">New Password</label>

        <input
            type="password"
            id="newPassword"
            autocomplete="new-password"
            minlength="8"
            required
        >

        <label for="confirmPassword">Confirm New Password</label>

        <input
            type="password"
            id="confirmPassword"
            autocomplete="new-password"
            minlength="8"
            required
        >

        <button type="submit" id="submitBtn">
            Reset Password
        </button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <a href="forgot-password.html" class="back-link">
        Request another reset link
    </a>
</main>

<script>
    const API_URL = "https://stay-finder-backend-t2ch.onrender.com/api/auth";

    const resetForm = document.getElementById("resetForm");
    const message = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");

    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    if (!token) {
        message.textContent =
            "The reset link is missing its token. Please request a new link.";
        submitBtn.disabled = true;
    }

    resetForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        if (!token) {
            return;
        }

        const newPassword =
            document.getElementById("newPassword").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        if (newPassword !== confirmPassword) {
            message.textContent = "Passwords do not match.";
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Updating...";
        message.textContent = "";

        try {
            const response = await fetch(
                `${API_URL}/reset-password`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        token,
                        newPassword,
                        confirmPassword
                    })
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.message || "Unable to reset your password."
                );
            }

            message.textContent =
                "Password reset successfully! You can now log in.";

            resetForm.reset();
            submitBtn.disabled = true;
        } catch (error) {
            message.textContent =
                error.message === "Failed to fetch"
                    ? "Cannot connect to the server. Please try again."
                    : error.message;
        } finally {
            submitBtn.textContent = "Reset Password";

            if (!message.textContent.includes("successfully")) {
                submitBtn.disabled = !token;
            }
        }
    });
</script>


</body>
</html>
