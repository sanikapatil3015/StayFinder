<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Stay Finder</title>


<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        font-family: Arial, sans-serif;
        background: #f3f6fc;
    }

    .reset-card {
        width: 100%;
        max-width: 420px;
        padding: 35px;
        background: white;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
        margin-top: 0;
        color: #173b70;
        text-align: center;
    }

    p {
        color: #64748b;
        line-height: 1.6;
        text-align: center;
    }

    label {
        display: block;
        margin: 22px 0 8px;
        font-weight: 600;
    }

    input {
        width: 100%;
        padding: 13px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 15px;
    }

    button {
        width: 100%;
        margin-top: 20px;
        padding: 14px;
        border: none;
        border-radius: 8px;
        background: #173b70;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #24549a;
    }

    button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    #message {
        margin-top: 15px;
        font-size: 14px;
        overflow-wrap: anywhere;
    }

    .back-link {
        display: block;
        margin-top: 20px;
        color: #173b70;
        text-align: center;
        text-decoration: none;
    }
</style>


</head>

<body>
    <main class="reset-card">
        <h1>Forgot Password?</h1>


    <p>
        Enter the email address associated with your
        Stay Finder account. If eligible, you'll receive
        instructions to reset your password.
    </p>

    <form id="forgotForm">
        <label for="email">Email Address</label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your registered email"
            autocomplete="email"
            required
        >

        <button type="submit" id="submitBtn">
            Send Reset Link
        </button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <a href="javascript:history.back()" class="back-link">
        Back to Login
    </a>
</main>

<script>
    const API_URL = "https://stay-finder-backend-t2ch.onrender.com/api/auth";

    const forgotForm = document.getElementById("forgotForm");
    const message = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");

    forgotForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();

        submitBtn.disabled = true;
        submitBtn.textContent = "Sending...";
        message.textContent = "";

        try {
            const response = await fetch(
                `${API_URL}/forgot-password`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email })
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.message || "Unable to process your request."
                );
            }

            message.textContent = data.message;
        } catch (error) {
            message.textContent =
                error.message === "Failed to fetch"
                    ? "Cannot connect to the server. Please check that Stay Finder's backend is running."
                    : error.message;
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Send Reset Link";
        }
    });
</script>


</body>
</html>
