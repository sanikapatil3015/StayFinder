
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stay Finder | Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 35px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-bottom: 8px;
            color: #1e3a8a;
            text-align: center;
        }

        .subtitle {
            margin-bottom: 25px;
            color: #64748b;
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            color: white;
            background: #1e40af;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.7;
            cursor: wait;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            color: #1e40af;
            text-align: center;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <h1>Stay Finder</h1>
        <p class="subtitle">Administrator Login</p>

        <form id="adminLoginForm">
            <label for="email">Admin Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter admin email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter admin password"
                required
            >

            <button type="submit" id="loginButton">
                Login as Admin
            </button>

            <p id="message" role="status" aria-live="polite"></p>
        </form>

        <a href="index.html" class="back-link">
            Back to Home
        </a>
    </div>

    <script src="admin-login.js"></script>
</body>
</html>
